sdk-version: 3.7.1
name: outcomia-protocol-roles
version: 0.1.0
source: daml
# Keep this interface-only package separate from template implementations so
# future protocol/resolution upgrades do not redefine the role interface.
dependencies:
  - daml-prim
  - daml-stdlib
build-options:
  - --target=2.1
  - --ghc-option=-Werror
